name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Electron 42 no longer downloads its binary at install; fetch it here so a download failure is its own step.
      - run: node node_modules/electron/install.js
      - run: node scripts/ci/audit-gate.mjs
      - run: npm test
      - run: npm run build
